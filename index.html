<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANIC DELIVERY - Arcade Delivery Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #1b2030 0%, #0d0f17 100%);
        font-family: 'Fredoka', 'Outfit', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 1280px;
        max-height: 720px;
        aspect-ratio: 16 / 9;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        background: #111420;
      }
      #three-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="three-canvas" width="1280" height="720"></canvas>
      <canvas id="game-canvas" width="1280" height="720"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
