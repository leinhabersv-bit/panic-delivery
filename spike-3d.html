<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANIC DELIVERY - 3D Visual Feasibility Spike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at center, #181d29 0%, #0b0e14 100%);
        font-family: 'Fredoka', 'Outfit', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 1280px;
        max-height: 720px;
        aspect-ratio: 16 / 9;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
        overflow: hidden;
        background: #0f131c;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #perf-hud {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.88);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        border-radius: 8px;
        padding: 10px 14px;
        color: #f8fafc;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        line-height: 1.5;
        z-index: 10;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      #perf-hud .title {
        font-weight: 800;
        color: #00f5d4;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #perf-hud .metric {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #perf-hud .val {
        color: #fee440;
        font-weight: 700;
      }
      #controls-hint {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 8px 20px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 600;
        z-index: 10;
        display: flex;
        gap: 16px;
        align-items: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      }
      #controls-hint kbd {
        background: #334155;
        color: #00f5d4;
        padding: 2px 7px;
        border-radius: 4px;
        border: 1px solid #475569;
        font-family: monospace;
      }
      #camera-controls {
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 8px 12px;
        color: #e2e8f0;
        font-size: 12px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #camera-controls button {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        font-weight: 600;
      }
      #camera-controls button:hover {
        background: #334155;
        border-color: #00f5d4;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="perf-hud">
        <div class="title">3D Visual Spike</div>
        <div class="metric"><span>Renderer:</span> <span class="val">Three.js WebGL</span></div>
        <div class="metric"><span>FPS:</span> <span class="val" id="val-fps">60</span></div>
        <div class="metric"><span>Draw Calls:</span> <span class="val" id="val-draws">0</span></div>
        <div class="metric"><span>Triangles:</span> <span class="val" id="val-tris">0</span></div>
        <div class="metric"><span>Geometries:</span> <span class="val" id="val-geom">0</span></div>
        <div class="metric"><span>Van Speed:</span> <span class="val" id="val-speed">0 px/s</span></div>
        <div class="metric"><span>Target Lock:</span> <span class="val" id="val-lock">NO</span></div>
      </div>

      <div id="camera-controls">
        <span style="font-weight: 700; color: #fee440;">Camera Mode</span>
        <button id="btn-cam-ortho">Orthographic 45°</button>
        <button id="btn-cam-persp">Perspective 45°</button>
        <button id="btn-cam-top">Top-Down 90°</button>
      </div>

      <div id="controls-hint">
        <span>Drive: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span>
        <span>Drift: <kbd>Z</kbd></span>
        <span>Hold/Throw: <kbd>SPACE</kbd></span>
      </div>

      <canvas id="three-canvas"></canvas>
    </div>
    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
